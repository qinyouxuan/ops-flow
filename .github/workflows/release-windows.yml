# SPDX-License-Identifier: MPL-2.0

name: Release Windows packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload
        required: true
        default: v0.2.5

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Verify source and build
        shell: pwsh
        run: |
          npm run lint
          npm run audit:prod
          npm run verify:source
          npm run dist:win
          npm run verify:release

      - name: Check release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:RELEASE_TAG) {
            throw "Tag $env:RELEASE_TAG does not match package version $version"
          }

      - name: Upload release assets
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release upload $env:RELEASE_TAG `
            "release/Ops Flow Plus Setup $version.exe" `
            "release/Ops Flow Plus-$version-win.zip" `
            "release/SHA256SUMS.txt" `
            --repo $env:GITHUB_REPOSITORY `
            --clobber
